<!-- basement_blueprint.svg / basement_foundation_plan.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -15 55 145" width="1200" height="2900">
  <defs>
    <!-- 1ft Fine Grid -->
    <pattern id="gridBase" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e0e0e0" stroke-width="0.05"/>
    </pattern>
    <!-- 5ft Major Grid -->
    <pattern id="majorGridBase" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#b0b0b0" stroke-width="0.1"/>
    </pattern>
  </defs>

  <!-- Clean White Canvas -->
  <rect x="-5" y="-15" width="55" height="145" fill="#ffffff"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#gridBase)"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#majorGridBase)"/>

  <!-- Title Block -->
  <text x="0" y="-11" fill="#000000" font-size="1.5" font-family="sans-serif" font-weight="bold">BASEMENT FOUNDATION PLAN</text>
  <text x="0" y="-8.8" fill="#555555" font-size="0.75" font-family="sans-serif">LOT: 45' x 120' | SHORTENED DRIVEWAY | REAR PORCH FLUSH RIGHT</text>

  <!-- ================= PROPERTY LINE & SHORTENED RIGHT DRIVEWAY ================= -->
  <rect x="0" y="0" width="45" height="120" fill="none" stroke="#000000" stroke-width="0.5"/>
  <text x="1.5" y="3.5" fill="#000000" font-size="0.85" font-family="sans-serif" font-weight="bold">PROPERTY LINE</text>

  <!-- Driveway Reference (Right Side: X: 31 to 43, Y: 34 to 120) -->
  <rect x="31" y="34" width="12" height="86" fill="none" stroke="#b0b0b0" stroke-width="0.33" stroke-dasharray="0.8,0.8"/>

  <!-- ================= SOLID BLACK FOUNDATION WALLS (25' x 71') ================= -->
  <!-- Outer Concrete Wall Bounds: X: 1.5 to 26.5, Y: 39.0 to 110.0 -->
  <rect x="1.5" y="39" width="25" height="71" fill="none" stroke="#000000" stroke-width="0.8"/>
  <!-- Inner Void Clearance: Thickness = 0.7' -->
  <rect x="2.2" y="39.7" width="23.6" height="69.6" fill="none" stroke="#000000" stroke-width="0.3"/>

  <!-- ================= STRUCTURAL CENTER GIRDER & LALLY COLUMNS ================= -->
  <!-- Center Steel Girder Beam (Centered at X = 14.0) -->
  <line x1="14" y1="40" x2="14" y2="109" stroke="#000000" stroke-width="0.7"/>

  <!-- 4 Cylindrical Lally Columns (Radius = 0.4') -->
  <circle cx="14" cy="51" r="0.4" fill="#000000"/>
  <circle cx="14" cy="65" r="0.4" fill="#000000"/>
  <circle cx="14" cy="79" r="0.4" fill="#000000"/>
  <circle cx="14" cy="93" r="0.4" fill="#000000"/>

  <!-- ================= REAR BILCO WALK-OUT ENTRANCE ================= -->
  <!-- Walk-Out Hatch Channel (Centered at X = 14.0: X: 11.5 to 16.5, Y: 33.0 to 39.0) -->
  <rect x="11.5" y="33" width="5" height="6" fill="#f4f4f4" stroke="#000000" stroke-width="0.4"/>
  <!-- Bilco Stair Treads descending to Basement Floor -->
  <line x1="11.5" y1="34" x2="16.5" y2="34" stroke="#000000" stroke-width="0.2"/>
  <line x1="11.5" y1="35" x2="16.5" y2="35" stroke="#000000" stroke-width="0.2"/>
  <line x1="11.5" y1="36" x2="16.5" y2="36" stroke="#000000" stroke-width="0.2"/>
  <line x1="11.5" y1="37" x2="16.5" y2="37" stroke="#000000" stroke-width="0.2"/>
  <line x1="11.5" y1="38" x2="16.5" y2="38" stroke="#000000" stroke-width="0.2"/>

  <!-- ================= 4 BACKYARD PORCH FOOTING PIERS (AT Y = 34.0) ================= -->
  <!-- Left Corner Pier -->
  <circle cx="9.5" cy="34" r="0.75" fill="#000000"/>
  <!-- Two Slim Walk-Out Flanking Pillars -->
  <circle cx="11.2" cy="34" r="0.35" fill="#000000"/>
  <circle cx="16.8" cy="34" r="0.35" fill="#000000"/>
  <!-- Right Corner Pier (Flush with Right Wall X = 26.5) -->
  <circle cx="26.5" cy="34" r="0.75" fill="#000000"/>
</svg>
