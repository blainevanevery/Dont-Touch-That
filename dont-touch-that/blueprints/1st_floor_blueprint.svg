<!-- 1st_floor_blueprint.svg / 1st_floor_plan.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -15 55 145" width="1200" height="2900">
  <defs>
    <pattern id="grid1" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e0e0e0" stroke-width="0.05"/>
    </pattern>
    <pattern id="majorGrid1" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#b0b0b0" stroke-width="0.1"/>
    </pattern>
  </defs>

  <rect x="-5" y="-15" width="55" height="145" fill="#ffffff"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#grid1)"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#majorGrid1)"/>

  <text x="-3" y="-11" fill="#000000" font-size="1.5" font-family="sans-serif" font-weight="bold">FIRST FLOOR PLAN (27' WIDE ON 48' LOT)</text>
  <text x="-3" y="-8.8" fill="#555555" font-size="0.75" font-family="sans-serif">EXT: 27' x 71' AT X: 0.0 TO 27.0, Y: 39.0 TO 110.0</text>

  <rect x="-3" y="0" width="48" height="120" fill="none" stroke="#000000" stroke-width="0.5"/>
  <rect x="31" y="34" width="12" height="86" fill="none" stroke="#b0b0b0" stroke-width="0.33" stroke-dasharray="0.8,0.8"/>

  <!-- Exterior Shell (27' x 71') -->
  <rect x="0.0" y="39" width="27" height="71" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Front Porch (X: 18.5 to 27.0, Y: 94 to 110) -->
  <rect x="18.5" y="94" width="8.5" height="16" fill="#fafafa" stroke="#000000" stroke-width="0.3"/>
  <text x="19.5" y="102.5" fill="#555555" font-size="0.75" font-family="sans-serif" font-weight="bold">FRONT PORCH</text>
</svg>
