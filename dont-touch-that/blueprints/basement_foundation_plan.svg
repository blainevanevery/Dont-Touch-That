<!-- basement_blueprint.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -15 55 145" width="1200" height="2900" style="background-color: #0d1b2a; font-family: 'Courier New', monospace;">
  <defs>
    <pattern id="gridBase" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#1b2a4a" stroke-width="0.04"/>
    </pattern>
    <pattern id="majorGridBase" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#283d6a" stroke-width="0.08"/>
    </pattern>
  </defs>

  <rect x="-5" y="-15" width="55" height="145" fill="url(#gridBase)"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#majorGridBase)"/>

  <!-- Title Block -->
  <text x="0" y="-11" fill="#00e5ff" font-size="1.5" font-weight="bold">BASEMENT FOUNDATION PLAN (SITE-ALIGNED)</text>
  <text x="0" y="-8.8" fill="#88a0c0" font-size="0.75">LOT: 45' x 120' | SHORTENED DRIVEWAY (Y: 34.0 TO 120.0) | HOUSE: 25' x 71' AT X: 1.5, Y: 39.0 TO 110.0</text>

  <!-- ================= PROPERTY LINE & SHORTENED RIGHT DRIVEWAY ================= -->
  <rect x="0" y="0" width="45" height="120" fill="none" stroke="#ffb703" stroke-width="0.35" stroke-dasharray="0.8,0.8"/>
  <text x="1.5" y="3.5" fill="#ffb703" font-size="0.85" font-weight="bold">PROPERTY LINE (45' x 120')</text>

  <rect x="31" y="34" width="12" height="86" fill="#14243b" stroke="#88a0c0" stroke-width="0.2" stroke-dasharray="0.4,0.4"/>
  <line x1="31" y1="34" x2="43" y2="34" stroke="#88a0c0" stroke-width="0.33"/>
  <text x="35" y="55" fill="#88a0c0" font-size="1.1" font-weight="bold" transform="rotate(90 35,55)">PAVED DRIVEWAY (12' WIDE)</text>
  <text x="35" y="85" fill="#88a0c0" font-size="1.1" font-weight="bold" transform="rotate(90 35,85)">PAVED DRIVEWAY (12' WIDE)</text>

  <!-- ================= RAISED PORCH FOUNDATION PIERS (Y = 34.0) ================= -->
  <rect x="9.5" y="34.0" width="1.2" height="1.2" fill="#ffb703" stroke="#ffffff" stroke-width="0.1"/>
  <rect x="17.5" y="34.0" width="1.2" height="1.2" fill="#ffb703" stroke="#ffffff" stroke-width="0.1"/>
  <rect x="25.3" y="34.0" width="1.2" height="1.2" fill="#ffb703" stroke="#ffffff" stroke-width="0.1"/>
  <text x="9.5" y="36.5" fill="#88a0c0" font-size="0.55">PORCH PIERS (Y = 34.0)</text>

  <!-- ================= BASEMENT CONCRETE FOUNDATION WALLS (X: 1.5 TO 26.5, Y: 39.0 TO 110.0) ================= -->
  <rect x="1.5" y="39" width="25" height="71" fill="#09131f" stroke="#4da6ff" stroke-width="0.6"/>
  <rect x="2.2" y="39.7" width="23.6" height="69.6" fill="none" stroke="#283d6a" stroke-width="0.2"/>

  <!-- Walk-out Storm Entrance / Bilco Doors (Rear Foundation: X: 11.5 to 16.5, Y: 33 to 39) -->
  <rect x="11.5" y="33" width="5" height="6" fill="#102030" stroke="#00e5ff" stroke-width="0.33"/>
  <line x1="14.0" y1="33" x2="14.0" y2="39" stroke="#00e5ff" stroke-width="0.2"/>
  <line x1="11.5" y1="34.5" x2="16.5" y2="34.5" stroke="#ffffff" stroke-width="0.1"/>
  <line x1="11.5" y1="36.0" x2="16.5" y2="36.0" stroke="#ffffff" stroke-width="0.1"/>
  <line x1="11.5" y1="37.5" x2="16.5" y2="37.5" stroke="#ffffff" stroke-width="0.1"/>
  <text x="10.0" y="32.0" fill="#00e5ff" font-size="0.55" font-weight="bold">WALK-OUT ENTRY</text>

  <!-- ================= STRUCTURAL BEARING GIRDER & LALLY POSTS ================= -->
  <line x1="14.0" y1="39.7" x2="14.0" y2="109.3" stroke="#ffb703" stroke-width="0.25" stroke-dasharray="0.6,0.6"/>
  
  <rect x="13.5" y="51" width="1.0" height="1.0" fill="#ffb703" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="13.5" y="65" width="1.0" height="1.0" fill="#ffb703" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="13.5" y="79" width="1.0" height="1.0" fill="#ffb703" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="13.5" y="93" width="1.0" height="1.0" fill="#ffb703" stroke="#ffffff" stroke-width="0.08"/>

  <!-- ================= BASEMENT ROOM PARTITIONS ================= -->
  <!-- Mechanical & Utility Room (Rear: Y = 39.7 to 59.0) -->
  <line x1="2.2" y1="59" x2="25.8" y2="59" stroke="#ffffff" stroke-width="0.33"/>
  <text x="3.5" y="49" fill="#ffffff" font-size="0.9" font-weight="bold">MECHANICAL &amp; UTILITY</text>
  <text x="3.5" y="51.5" fill="#88a0c0" font-size="0.55">(Furnace, Water Heaters, Breakers)</text>

  <!-- Main Open Storage / Workshop (Center: Y = 59.0 to 87.0) -->
  <line x1="2.2" y1="87" x2="25.8" y2="87" stroke="#ffffff" stroke-width="0.33"/>
  <text x="5.5" y="73" fill="#ffffff" font-size="1.1" font-weight="bold">MAIN STORAGE / WORKSHOP</text>

  <!-- Cold Vault / Root Cellar (Front-Left: X: 2.2 to 12.5, Y: 87.0 to 109.3) -->
  <line x1="12.5" y1="87" x2="12.5" y2="109.3" stroke="#ffffff" stroke-width="0.33"/>
  <text x="3.5" y="97" fill="#ffffff" font-size="0.8" font-weight="bold">COLD VAULT</text>

  <!-- Front Laundry & Utility (Front-Right: X: 12.5 to 25.8, Y: 87.0 to 109.3) -->
  <text x="15.0" y="97" fill="#ffffff" font-size="0.8" font-weight="bold">LAUNDRY / UTILITY</text>

  <!-- Interior Doors -->
  <path d="M 12.5 59 L 12.5 56 A 3 3 0 0 0 9.5 59" fill="none" stroke="#00ff66" stroke-width="0.25"/>
  <path d="M 12.5 87 L 12.5 84 A 3 3 0 0 0 9.5 87" fill="none" stroke="#00ff66" stroke-width="0.25"/>

  <!-- ================= FOUNDATION HOPPER WINDOWS ================= -->
  <rect x="1.5" y="49" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="1.5" y="74" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="1.5" y="97" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.8" y="49" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.8" y="74" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.8" y="97" width="0.7" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
</svg>

