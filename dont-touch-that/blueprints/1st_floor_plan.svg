<!-- 1st_floor_blueprint.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -15 55 145" width="1200" height="2900" style="background-color: #0d1b2a; font-family: 'Courier New', monospace;">
  <defs>
    <pattern id="grid1" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#1b2a4a" stroke-width="0.04"/>
    </pattern>
    <pattern id="majorGrid1" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#283d6a" stroke-width="0.08"/>
    </pattern>
  </defs>

  <rect x="-5" y="-15" width="55" height="145" fill="url(#grid1)"/>
  <rect x="-5" y="-15" width="55" height="145" fill="url(#majorGrid1)"/>

  <!-- Title Block -->
  <text x="0" y="-11" fill="#00e5ff" font-size="1.5" font-weight="bold">FIRST FLOOR PLAN (SITE-ALIGNED)</text>
  <text x="0" y="-8.8" fill="#88a0c0" font-size="0.75">EXT: 25' x 71' AT X: 1.5, Y: 39.0 TO 110.0 | SHORTENED DRIVEWAY (Y: 34.0 TO 120.0)</text>

  <!-- Driveway Reference Surface (Terminating at Porch Stair Landing Y = 34.0) -->
  <rect x="31" y="34" width="12" height="86" fill="#14243b" stroke="#88a0c0" stroke-width="0.15" stroke-dasharray="0.4,0.4"/>
  <line x1="31" y1="34" x2="43" y2="34" stroke="#88a0c0" stroke-width="0.33"/>

  <!-- Exterior Shell -->
  <rect x="1.5" y="39" width="25" height="71" fill="none" stroke="#4da6ff" stroke-width="0.5"/>

  <!-- ================= RAISED REAR PORCH & DRIVEWAY STAIRCASE (Y = 34.0 TO 39.5) ================= -->
  <!-- Porch Deck (X: 9.5 to 18.5, Y: 34.0 to 39.5) -->
  <rect x="9.5" y="34" width="9" height="5.5" fill="#14243b" stroke="#00e5ff" stroke-width="0.2" stroke-dasharray="0.3,0.3"/>
  <text x="10.3" y="36.2" fill="#4da6ff" font-size="0.7" font-weight="bold">RAISED PORCH</text>
  <text x="11.0" y="37.5" fill="#88a0c0" font-size="0.5">(Exterior Deck)</text>

  <!-- Exterior Stairs Aiming Right towards Shortened Driveway (X: 18.5 to 26.5, Y: 34.0 to 38.0) -->
  <rect x="18.5" y="34" width="8" height="4" fill="#0a1424" stroke="#ffffff" stroke-width="0.25"/>
  <line x1="20.1" y1="34" x2="20.1" y2="38" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="21.7" y1="34" x2="21.7" y2="38" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="23.3" y1="34" x2="23.3" y2="38" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="24.9" y1="34" x2="24.9" y2="38" stroke="#ffffff" stroke-width="0.12"/>
  <text x="20.0" y="35.8" fill="#00e5ff" font-size="0.55" font-weight="bold">DN ➔</text>
  <text x="19.0" y="37.2" fill="#ffffff" font-size="0.42">TO DRIVEWAY</text>

  <!-- ================= EXTENDED FRONT PORCH (Y = 94.0 to 110.0, X = 18.5 to 26.5) ================= -->
  <rect x="18.5" y="94" width="8" height="16" fill="#14243b" stroke="#00e5ff" stroke-width="0.15" stroke-dasharray="0.3,0.3"/>
  <text x="19.5" y="102.5" fill="#4da6ff" font-size="0.85" font-weight="bold">EXTENDED</text>
  <text x="19.5" y="104.0" fill="#4da6ff" font-size="0.85" font-weight="bold">FRONT PORCH</text>
  <text x="19.5" y="105.5" fill="#88a0c0" font-size="0.5">(8' x 16' Deep)</text>

  <line x1="18.5" y1="94" x2="18.5" y2="109.5" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="18.5" y1="94" x2="26.0" y2="94" stroke="#ffffff" stroke-width="0.33"/>

  <!-- ================= BACK PORCH WITH RIGHT-TO-LEFT STAIRS (Y = 39.5 to 53.5) ================= -->
  <!-- Internal Porch Stairs Enclosure to 2nd Floor (Rear Left: X: 2.0 to 11.0, Y: 39.5 to 45.0) -->
  <rect x="2.0" y="39.5" width="9.0" height="5.5" fill="none" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="9.5" y1="39.5" x2="9.5" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="8.3" y1="39.5" x2="8.3" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="7.1" y1="39.5" x2="7.1" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="5.9" y1="39.5" x2="5.9" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="4.7" y1="39.5" x2="4.7" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>
  <line x1="3.5" y1="39.5" x2="3.5" y2="45.0" stroke="#ffffff" stroke-width="0.12"/>

  <text x="4.0" y="42.5" fill="#00e5ff" font-size="0.7" font-weight="bold">◀ UP</text>
  <text x="2.5" y="44.2" fill="#ffffff" font-size="0.45">STAIRS (R➔L)</text>

  <!-- Center Back Door (X: 12.5 to 15.5, Y: 39.5) -->
  <path d="M 12.5 39.5 L 12.5 36.5 A 3 3 0 0 1 15.5 39.5" fill="none" stroke="#00ff66" stroke-width="0.25"/>
  <text x="11.3" y="40.8" fill="#00ff66" font-size="0.55" font-weight="bold">[BACK DOOR]</text>

  <!-- Back Porch Deck Space -->
  <path d="M 11 39.5 L 26 39.5 L 26 53.5 L 16.5 53.5 L 16.5 49 L 2.0 49 L 2.0 45.0 L 11 45.0 Z" fill="#14243b" stroke="#00e5ff" stroke-width="0.15" stroke-dasharray="0.3,0.3"/>
  <text x="15.5" y="44.5" fill="#4da6ff" font-size="1.0" font-weight="bold">BACK PORCH</text>

  <!-- Stepped Porch Dividing Walls -->
  <line x1="2.0" y1="49" x2="16.5" y2="49" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="16.5" y1="49" x2="16.5" y2="53.5" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="16.5" y1="53.5" x2="26.0" y2="53.5" stroke="#ffffff" stroke-width="0.33"/>

  <!-- ================= BATHROOM, CLOSET D & NOOK (Y = 49 to 60) ================= -->
  <!-- Bathroom (X: 11.0 to 16.5, Y: 49.0 to 60.0) -->
  <rect x="11" y="49" width="5.5" height="11" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.33"/>
  <text x="11.7" y="54.5" fill="#ffffff" font-size="0.75" font-weight="bold">BATH</text>
  
  <!-- Closet D (X: 16.5 to 21.0, Y: 53.5 to 60.0) -->
  <rect x="16.5" y="53.5" width="4.5" height="6.5" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.33"/>
  <text x="16.8" y="57" fill="#ffffff" font-size="0.55" font-weight="bold">CLOSET D</text>

  <!-- Nook (X: 21.0 to 26.0, Y: 53.5 to 60.0) -->
  <rect x="21" y="53.5" width="5.0" height="6.5" fill="#112233" stroke="#88a0c0" stroke-width="0.1" stroke-dasharray="0.3,0.3"/>
  <text x="22.0" y="56.5" fill="#00e5ff" font-size="0.7" font-weight="bold">NOOK</text>

  <!-- ================= BEDROOM B & EXTENDED KITCHEN (Y = 60 to 74.5) ================= -->
  <line x1="2.0" y1="49" x2="11.0" y2="49" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="11.0" y1="60" x2="11.0" y2="74.5" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="2.0" y1="74.5" x2="13.5" y2="74.5" stroke="#ffffff" stroke-width="0.33"/>
  
  <rect x="2.0" y="69.5" width="4.5" height="5" fill="none" stroke="#ffffff" stroke-width="0.33"/>
  <text x="2.5" y="72.5" fill="#ffffff" font-size="0.55">CLOSET B</text>
  <rect x="6.5" y="69.5" width="4.5" height="5" fill="none" stroke="#ffffff" stroke-width="0.33"/>
  <text x="7.0" y="72.5" fill="#ffffff" font-size="0.55">CLOSET C</text>
  <text x="3.5" y="63" fill="#ffffff" font-size="0.85" font-weight="bold">BEDROOM B</text>

  <!-- Extended Kitchen -->
  <text x="15.0" y="66" fill="#ffffff" font-size="1.1" font-weight="bold">EXTENDED KITCHEN</text>
  <line x1="13.5" y1="74.5" x2="26.0" y2="74.5" stroke="#ffffff" stroke-width="0.33"/>

  <!-- ================= LIVING ROOM & BEDROOM A (Y = 74.5 to 94) ================= -->
  <line x1="12.5" y1="74.5" x2="12.5" y2="94" stroke="#ffffff" stroke-width="0.33"/>
  <line x1="2.0" y1="94" x2="12.5" y2="94" stroke="#ffffff" stroke-width="0.33"/>
  <text x="4.0" y="83" fill="#ffffff" font-size="0.9" font-weight="bold">BEDROOM A</text>
  <text x="15.5" y="83" fill="#ffffff" font-size="1.0" font-weight="bold">LIVING ROOM</text>

  <!-- ================= FRONT SECTION: DINING ROOM & STAIRS (Y = 94 to 109.5) ================= -->
  <!-- Stairs Enclosure to 2nd Floor (Front-Left: X: 2.0 to 7.0, Y: 94.0 to 109.5) -->
  <rect x="2.0" y="94" width="5.0" height="15.5" fill="none" stroke="#ffffff" stroke-width="0.33"/>
  <text x="2.5" y="99" fill="#00e5ff" font-size="0.6" font-weight="bold">▲ UP</text>
  <text x="2.5" y="101" fill="#ffffff" font-size="0.55">STAIRS</text>
  
  <!-- Dining Room (X: 7.0 to 18.5, Y: 94.0 to 109.5) -->
  <line x1="7.0" y1="94" x2="18.5" y2="94" stroke="#ffffff" stroke-width="0.33"/>
  <text x="10.0" y="102" fill="#ffffff" font-size="0.9" font-weight="bold">DINING ROOM</text>

  <!-- ================= DOORS ================= -->
  <!-- 2nd Floor Front Entry Door -->
  <path d="M 3.0 109.5 L 3.0 106.5 A 3 3 0 0 1 6.0 109.5" fill="none" stroke="#00ff66" stroke-width="0.3"/>
  <text x="2.1" y="111.2" fill="#00ff66" font-size="0.55" font-weight="bold">[2ND FL DOOR]</text>

  <!-- Main 1st Floor Entrance -->
  <path d="M 20.5 94 L 20.5 91 A 3 3 0 0 1 23.5 94" fill="none" stroke="#00ff66" stroke-width="0.3"/>
  <text x="19.5" y="92.5" fill="#00ff66" font-size="0.55" font-weight="bold">[PORCH TO LIVING]</text>

  <!-- Dining to Living -->
  <path d="M 12.5 94 L 15.5 94 A 3 3 0 0 1 12.5 91" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Bedroom A Entry -->
  <path d="M 12.5 90 L 12.5 93 A 3 3 0 0 0 15.5 90" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Kitchen to Living -->
  <path d="M 18.5 74.5 L 21.5 74.5 A 3 3 0 0 1 18.5 77.5" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Bedroom B Entry -->
  <path d="M 11.0 67 L 11.0 70 A 3 3 0 0 0 14.0 67" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Bathroom Door from Kitchen/Hallway -->
  <path d="M 12.5 60 L 12.5 57 A 3 3 0 0 1 15.5 60" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Closet D Door Facing Nook -->
  <path d="M 21.0 55.5 L 24.0 55.5 A 3 3 0 0 1 21.0 58.5" fill="none" stroke="#00ff66" stroke-width="0.2"/>

  <!-- Porch Entry Door on Right Wall (Y = 53.5) -->
  <path d="M 23.0 53.5 L 23.0 50.5 A 3 3 0 0 1 26.0 53.5" fill="none" stroke="#00ff66" stroke-width="0.25"/>

  <!-- ================= WINDOWS ================= -->
  <!-- Front Dining Windows -->
  <rect x="8.5" y="109.5" width="3.5" height="0.6" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="13.5" y="109.5" width="3.5" height="0.6" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  
  <!-- Right Wall Windows -->
  <rect x="25.9" y="42" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.9" y="47" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.9" y="64" width="0.6" height="3.5" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.9" y="81" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="25.9" y="88" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  
  <!-- Left Wall Windows -->
  <rect x="1.5" y="63" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="1.5" y="83" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  <rect x="1.5" y="89" width="0.6" height="3" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
  
  <!-- Back Porch Window (To the right of center back door) -->
  <rect x="17.0" y="39" width="3.5" height="0.6" fill="#00e5ff" stroke="#ffffff" stroke-width="0.08"/>
</svg>

